# Sribees Supply — development stack on the Contabo box (/opt/sribees-supply-dev).
# Same shape as Sribees Finance's dev stack.
#
# The box's public edge is sribees-express-dev's Caddy (it owns 80/443). This stack
# publishes no host port: `web` joins the shared `sribees_default` network under the alias
# sribees-supply-dev-web, and the Caddy block for devsupply.sribees.com proxies to it.
# `web` passes /api/ to `api` (and will serve the staff web app); nothing else is reachable.
#
# `api` also joins sribees_default to reach the Online dev API by container name
# (sribees-online-dev-app:8000) without the edge: Online's internal routes refuse
# forwarded requests.
#
# SUPPLY_IMAGE is set by the deploy (an image built on the box, tagged by commit).

name: sribees-supply-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: supply
      POSTGRES_USER: supply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supply -d supply"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    image: ${SUPPLY_IMAGE:?set SUPPLY_IMAGE}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      internal: {}
      edge:
        # Finance reads /internal/finance/events here (never through the web/Caddy).
        aliases: [sribees-supply-dev-api]

  # Reads Finance's answers (PO approved / rejected) and sends supplier app alerts. Waits
  # quietly while neither is configured: the command exits and restart brings it back.
  worker:
    image: ${SUPPLY_IMAGE:?set SUPPLY_IMAGE}
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "python -m app.cli worker || sleep 300"]
    healthcheck:
      disable: true  # the image's check calls the API, which a worker does not serve
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/srv/web:ro
    networks:
      internal: {}
      edge:
        aliases: [sribees-supply-dev-web]

volumes:
  pgdata:

networks:
  internal: {}
  edge:
    name: sribees_default
    external: true
