# Sribees Supply — production stack on the Contabo box (/opt/sribees-supply-prod).
#
# Same shape as docker-compose.dev.yml, with its own database and secrets and a nightly
# backup. No host port: `web` joins `sribees_default` as sribees-supply-prod-web and the
# Caddy block for supplier.sribeesonline.com proxies to it. `web` serves the staff web
# app and passes /api/ to `api` (the supplier app uses /api too).
#
# `api` reaches Online production by container name (sribees-online-prod-app:8000) on
# sribees_default: Online's internal routes refuse forwarded requests.
#
# SUPPLY_IMAGE is set by the deploy (an image built on the box, tagged by commit).

name: sribees-supply-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: supply
      POSTGRES_USER: supply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supply -d supply"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    image: ${SUPPLY_IMAGE:?set SUPPLY_IMAGE}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      internal: {}
      edge:
        # Finance reads /internal/finance/events here (never through the web/Caddy).
        aliases: [sribees-supply-prod-api]

  # Reads Finance's answers (PO approved / rejected) and sends supplier app alerts. Waits
  # quietly while neither is configured: the command exits and restart brings it back.
  worker:
    image: ${SUPPLY_IMAGE:?set SUPPLY_IMAGE}
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "python -m app.cli worker || sleep 300"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/srv/web:ro
    networks:
      internal: {}
      edge:
        aliases: [sribees-supply-prod-web]

  # Nightly database dump (custom format), kept 14 days on the box.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump -h postgres -U supply -d supply -Fc -f "/backups/supply-$$stamp.dump.part" \
            && mv "/backups/supply-$$stamp.dump.part" "/backups/supply-$$stamp.dump"
          chmod 600 /backups/supply-*.dump 2>/dev/null
          find /backups -name 'supply-*.dump' -mtime +14 -delete
          sleep 86400
        done
    networks: [internal]

volumes:
  pgdata:

networks:
  internal: {}
  edge:
    name: sribees_default
    external: true
